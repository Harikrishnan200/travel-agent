name: CI

on:
  push:
    branches: [main, master]
  pull_request:

# A second push to the same branch cancels the first: no value in finishing a
# run for a commit nobody is looking at any more.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # The suite is hermetic - fake Redis, in-memory checkpointer, no LLM keys -
  # but these make the intent explicit rather than relying on defaults.
  USE_MOCK_DATA: "true"
  APP_ENV: ci

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - run: pip install -r requirements-dev.txt

      - name: ruff check
        run: ruff check .

      - name: ruff format
        run: ruff format --check .

  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.12 is what the Docker image ships; 3.13 is what it is developed on.
        # A difference between them should fail here, not in someone's clone.
        python-version: ["3.12", "3.13"]

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: travel
          POSTGRES_PASSWORD: travel
          POSTGRES_DB: travel
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U travel -d travel"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+psycopg://travel:travel@localhost:5432/travel
      REDIS_URL: redis://localhost:6379/0

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - run: pip install -r requirements-dev.txt

      # Postgres is running, so the persistence tests actually run rather than
      # skipping themselves the way they do on a machine without one.
      - name: pytest
        run: pytest -q --cov

      - name: Evaluation
        run: python -m evaluation.evaluate

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build the image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: travel-agent:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Building proves it compiles; starting proves the image is usable.
      - name: The image starts and answers
        run: |
          docker run -d --name app -p 8000:8000 travel-agent:ci
          for _ in $(seq 1 30); do
            curl -sf localhost:8000/health && break
            sleep 2
          done
          curl -sf localhost:8000/health | grep -q '"status":"ok"'
          docker rm -f app
